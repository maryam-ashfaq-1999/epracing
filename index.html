<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22><rect width=%2232%22 height=%2232%22 rx=%226%22 fill=%22%23d23c2e%22/><text x=%2216%22 y=%2222%22 font-size=%2218%22 text-anchor=%22middle%22 fill=%22white%22>%F0%9F%8F%8E</text></svg>" />
    <title>EP Highway</title>
    <style>
      :root {
        color-scheme: dark;
      }
      html, body {
        margin: 0;
        padding: 0;
        background: #0d1730;
        overflow: hidden;
        width: 100%;
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      #app {
        position: fixed;
        inset: 0;
      }
      #canvasHost {
        position: absolute;
        inset: 0;
        touch-action: none;
      }
      #canvasHost canvas {
        display: block;
        width: 100%;
        height: 100%;
      }

      #hud {
        position: absolute;
        inset: 0;
        pointer-events: none;
        user-select: none;
      }

      .top-row {
        position: absolute;
        top: max(14px, env(safe-area-inset-top));
        left: max(14px, env(safe-area-inset-left));
        right: max(14px, env(safe-area-inset-right));
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: start;
        gap: 8px;
      }

      .progress {
        justify-self: start;
        color: #e9edf7;
        min-width: 0;
      }
      .progress-label {
        font-size: clamp(11px, 2.4vw, 15px);
        pointer-events: auto;
        cursor: pointer;
        display: inline-block;
      }
      .progress-pct {
        font-size: clamp(20px, 5.2vw, 30px);
        font-weight: 700;
        color: #fff;
        line-height: 1.15;
      }
      .progress-track {
        margin-top: 6px;
        width: clamp(100px, 40vw, 300px);
        height: clamp(8px, 1.6vw, 12px);
        background: rgba(13, 23, 48, 0.55);
        border-radius: 999px;
        overflow: hidden;
      }
      .progress-fill {
        height: 100%;
        width: 0%;
        background: #8de35b;
        border-radius: 999px;
        transition: width 0.15s linear;
      }

      .pause-btn {
        justify-self: center;
        pointer-events: auto;
        width: clamp(36px, 6vw, 52px);
        height: clamp(36px, 6vw, 52px);
        border-radius: 50%;
        border: none;
        background: rgba(13, 23, 48, 0.55);
        color: #fff;
        font-size: clamp(14px, 2.6vw, 20px);
        font-weight: 700;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
      }
      .pause-btn:active {
        background: rgba(13, 23, 48, 0.85);
      }

      .star-pill {
        justify-self: end;
        pointer-events: none;
        display: flex;
        align-items: center;
        gap: 6px;
        background: rgba(13, 23, 48, 0.55);
        border-radius: 999px;
        padding: clamp(6px, 1.4vw, 10px) clamp(12px, 2.6vw, 18px);
        color: #fff;
        font-weight: 700;
        font-size: clamp(14px, 3vw, 19px);
        white-space: nowrap;
      }
      .star-pill .star-icon {
        color: #ffd35c;
        font-size: clamp(14px, 3vw, 19px);
      }

      .paused-overlay {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: #fff;
        font-size: clamp(28px, 8vw, 52px);
        font-weight: 800;
        letter-spacing: 0.08em;
        text-shadow: 0 0 4px #0d1730, 0 0 12px #0d1730, 0 2px 0 #0d1730;
      }
      .paused-overlay.hidden {
        display: none;
      }

      .arrow-btn {
        position: absolute;
        bottom: max(48px, calc(env(safe-area-inset-bottom) + 24px));
        width: clamp(52px, 9vw, 76px);
        height: clamp(52px, 9vw, 76px);
        border-radius: 50%;
        border: none;
        background: rgba(13, 23, 48, 0.5);
        color: #fff;
        font-size: clamp(24px, 4.5vw, 34px);
        font-weight: 700;
        display: flex;
        align-items: center;
        justify-content: center;
        pointer-events: auto;
        cursor: pointer;
      }
      .arrow-btn:active {
        background: rgba(13, 23, 48, 0.8);
      }
      #leftBtn {
        left: max(20px, env(safe-area-inset-left));
      }
      #rightBtn {
        right: max(20px, env(safe-area-inset-right));
      }

      .popup-layer {
        position: absolute;
        left: 50%;
        top: 62%;
        width: 0;
        height: 0;
      }
      .popup {
        position: absolute;
        left: 0;
        top: 0;
        transform: translate(-50%, -50%);
        color: #ffe08a;
        font-weight: 800;
        font-size: clamp(18px, 4vw, 26px);
        text-shadow: 0 0 3px #0d1730, 0 0 8px #0d1730;
        animation: popup-float 0.8s ease-out forwards;
        white-space: nowrap;
      }
      @keyframes popup-float {
        from {
          opacity: 1;
          transform: translate(-50%, -50%);
        }
        to {
          opacity: 0;
          transform: translate(-50%, -150%);
        }
      }

      .finish-overlay {
        position: absolute;
        inset: 0;
        background: rgba(13, 23, 48, 0.78);
        display: flex;
        align-items: center;
        justify-content: center;
        pointer-events: auto;
      }
      .finish-overlay.hidden {
        display: none;
      }
      .finish-card {
        background: #1b2547;
        border-radius: 20px;
        padding: clamp(24px, 6vw, 40px) clamp(28px, 9vw, 52px);
        text-align: center;
        color: #fff;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
        max-height: 88vh;
        overflow-y: auto;
        box-sizing: border-box;
      }
      .finish-title {
        font-size: clamp(22px, 6vw, 32px);
        font-weight: 800;
        letter-spacing: 0.06em;
        margin-bottom: 12px;
      }
      .finish-score {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        font-size: clamp(36px, 11vw, 58px);
        font-weight: 800;
        color: #ffd35c;
      }
      .finish-score .star-icon {
        font-size: 0.6em;
      }
      .finish-subtitle {
        font-size: clamp(12px, 3vw, 15px);
        color: #b9c2e0;
        margin: 4px 0 22px;
      }
      .retry-btn {
        background: #8de35b;
        color: #0d1730;
        border: none;
        border-radius: 999px;
        padding: 14px 40px;
        font-size: clamp(15px, 4vw, 19px);
        font-weight: 800;
        cursor: pointer;
      }
      .retry-btn:active {
        background: #7ccb4d;
      }
      .secondary-action-btn {
        display: block;
        margin: 12px auto 0;
        background: rgba(255, 255, 255, 0.12);
        color: #fff;
        border: none;
        border-radius: 999px;
        padding: 12px 32px;
        font-size: clamp(13px, 3.4vw, 16px);
        font-weight: 700;
        cursor: pointer;
      }
      .secondary-action-btn:active {
        background: rgba(255, 255, 255, 0.22);
      }

      .strike-bar {
        position: absolute;
        top: calc(max(14px, env(safe-area-inset-top)) + 70px);
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 8px;
      }
      .strike {
        width: clamp(30px, 6vw, 42px);
        height: clamp(30px, 6vw, 42px);
        border-radius: 50%;
        background: radial-gradient(circle at 35% 30%, #ff8a8a, #d92c2c 70%);
        color: #3a0000;
        font-weight: 800;
        font-size: clamp(14px, 3vw, 20px);
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.35), 0 0 0 2px rgba(255, 255, 255, 0.3) inset;
        animation: badge-pop 0.4s ease-out;
      }

      .lose-overlay {
        position: absolute;
        inset: 0;
        background: rgba(43, 10, 10, 0.82);
        display: flex;
        align-items: center;
        justify-content: center;
        pointer-events: auto;
      }
      .lose-overlay.hidden {
        display: none;
      }
      .lose-card {
        background: #3a1414;
        border-radius: 20px;
        padding: clamp(24px, 6vw, 40px) clamp(28px, 9vw, 52px);
        text-align: center;
        color: #fff;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
        max-height: 88vh;
        overflow-y: auto;
        box-sizing: border-box;
      }
      .lose-title {
        font-size: clamp(22px, 6vw, 32px);
        font-weight: 800;
        letter-spacing: 0.04em;
        margin-bottom: 22px;
        color: #ff8a8a;
      }

      .badge-bar {
        position: absolute;
        top: calc(max(14px, env(safe-area-inset-top)) + 70px);
        right: max(14px, env(safe-area-inset-right));
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
      }
      .badge {
        width: clamp(38px, 8vw, 54px);
        height: clamp(38px, 8vw, 54px);
        border-radius: 50%;
        background: radial-gradient(circle at 35% 30%, #ffe58a, #f5a623 70%);
        color: #3a2400;
        font-weight: 800;
        font-size: clamp(11px, 2.6vw, 14px);
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 0 8px 2px rgba(245, 166, 35, 0.55), 0 4px 10px rgba(0, 0, 0, 0.35),
          0 0 0 2px rgba(255, 255, 255, 0.3) inset;
        animation: badge-pop 0.4s ease-out, badge-breathe 2.4s ease-in-out 0.4s infinite;
      }
      @keyframes badge-pop {
        from {
          transform: scale(0);
          opacity: 0;
        }
        to {
          transform: scale(1);
          opacity: 1;
        }
      }
      @keyframes badge-breathe {
        0%,
        100% {
          transform: scale(1);
          box-shadow: 0 0 8px 2px rgba(245, 166, 35, 0.55), 0 4px 10px rgba(0, 0, 0, 0.35),
            0 0 0 2px rgba(255, 255, 255, 0.3) inset;
        }
        50% {
          transform: scale(1.08);
          box-shadow: 0 0 22px 8px rgba(245, 166, 35, 0.9), 0 4px 14px rgba(0, 0, 0, 0.35),
            0 0 0 2px rgba(255, 255, 255, 0.45) inset;
        }
      }

      .hit-flash {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: radial-gradient(ellipse at center, rgba(255, 59, 59, 0) 40%, rgba(255, 59, 59, 0.6) 100%);
        opacity: 0;
      }
      .hit-flash.flash {
        animation: hit-flash-anim 0.5s ease-out;
      }
      @keyframes hit-flash-anim {
        0% {
          opacity: 1;
        }
        100% {
          opacity: 0;
        }
      }

      .milestone-banner {
        position: absolute;
        top: 36%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: #ffe58a;
        font-weight: 800;
        font-size: clamp(22px, 7.5vw, 42px);
        text-align: center;
        text-shadow: 0 0 8px #ffd35c, 0 0 22px #ffb020, 0 0 44px #ffb020;
        pointer-events: none;
        opacity: 0;
        white-space: nowrap;
      }
      .milestone-banner.show {
        animation: milestone-glow 2s ease-in-out forwards;
      }
      @keyframes milestone-glow {
        0% {
          opacity: 0;
          transform: translate(-50%, -50%) scale(0.8);
        }
        12% {
          opacity: 1;
          transform: translate(-50%, -50%) scale(1.05);
        }
        20% {
          transform: translate(-50%, -50%) scale(1);
        }
        80% {
          opacity: 1;
        }
        100% {
          opacity: 0;
        }
      }

      .menu-toggle-btn {
        position: absolute;
        top: max(14px, env(safe-area-inset-top));
        left: max(14px, env(safe-area-inset-left));
        pointer-events: auto;
        width: clamp(36px, 6vw, 52px);
        height: clamp(36px, 6vw, 52px);
        border-radius: 50%;
        border: none;
        background: rgba(13, 23, 48, 0.55);
        color: #fff;
        font-size: clamp(16px, 3vw, 22px);
        font-weight: 700;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        z-index: 10;
      }
      .menu-toggle-btn:active {
        background: rgba(13, 23, 48, 0.85);
      }

      .quick-menu {
        position: absolute;
        top: calc(max(14px, env(safe-area-inset-top)) + 62px);
        left: max(14px, env(safe-area-inset-left));
        width: min(220px, 70vw);
        background: rgba(27, 37, 71, 0.72);
        backdrop-filter: blur(6px);
        border-radius: 16px;
        padding: 10px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
        pointer-events: auto;
        box-sizing: border-box;
        z-index: 10;
      }
      .quick-menu.hidden {
        display: none;
      }

      .modal-overlay {
        position: absolute;
        inset: 0;
        background: rgba(3, 6, 14, 0.5);
        display: flex;
        align-items: center;
        justify-content: center;
        pointer-events: auto;
        z-index: 5;
      }
      .modal-overlay.hidden {
        display: none;
      }
      .modal-card {
        position: relative;
        background: rgba(27, 37, 71, 0.58);
        backdrop-filter: blur(8px);
        border-radius: 20px;
        padding: clamp(24px, 6vw, 36px);
        text-align: center;
        color: #fff;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        width: min(320px, 86vw);
        max-height: 85vh;
        overflow-y: auto;
        box-sizing: border-box;
      }
      .modal-close-btn {
        position: absolute;
        top: 14px;
        right: 14px;
        width: 34px;
        height: 34px;
        border-radius: 50%;
        border: none;
        background: rgba(255, 255, 255, 0.1);
        color: #fff;
        font-size: 16px;
        font-weight: 700;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        z-index: 1;
      }
      .modal-close-btn:active {
        background: rgba(255, 255, 255, 0.2);
      }
      #leaderboardOverlay .modal-card,
      #scoreDistributionOverlay .modal-card {
        width: 90vw;
        height: 90vh;
        max-width: 90vw;
        max-height: 90vh;
        display: flex;
        flex-direction: column;
      }
      #leaderboardOverlay .leaderboard-section {
        flex: 1;
        min-height: 0;
        max-height: none;
      }
      #scoreDistributionOverlay .score-chart {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
      }
      .modal-title {
        font-size: clamp(18px, 5vw, 24px);
        font-weight: 800;
        margin-bottom: 16px;
      }
      #startDialogTitle {
        cursor: pointer;
      }
      .menu-input {
        width: 100%;
        box-sizing: border-box;
        padding: 12px 16px;
        border-radius: 12px;
        border: none;
        background: rgba(255, 255, 255, 0.08);
        color: #fff;
        font-size: clamp(14px, 3.5vw, 16px);
        margin-bottom: 14px;
        outline: none;
      }
      .menu-input::placeholder {
        color: #7c86ab;
      }
      .menu-btn {
        width: 100%;
        box-sizing: border-box;
        background: #8de35b;
        color: #0d1730;
        border: none;
        border-radius: 999px;
        padding: 14px 20px;
        font-size: clamp(14px, 4vw, 17px);
        font-weight: 800;
        cursor: pointer;
        margin-bottom: 10px;
      }
      .menu-btn:active {
        background: #7ccb4d;
      }
      .menu-btn.secondary {
        background: rgba(255, 255, 255, 0.1);
        color: #fff;
      }
      .menu-btn.secondary:active {
        background: rgba(255, 255, 255, 0.18);
      }
      .menu-btn.danger {
        background: transparent;
        color: #ff8a8a;
        font-size: clamp(12px, 3vw, 13px);
        font-weight: 700;
        padding: 8px 12px;
        margin: 6px 0 0;
        border-top: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 0;
        padding-top: 14px;
      }
      .menu-btn.danger:active {
        color: #ff5c5c;
      }
      .menu-btn.danger-solid {
        background: #ff3b3b;
        color: #fff;
        margin-bottom: 10px;
      }
      .menu-btn.danger-solid:active {
        background: #e02e2e;
      }
      .menu-btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .menu-error {
        color: #ff8a8a;
        font-size: 13px;
        margin-top: -4px;
        margin-bottom: 10px;
      }
      .menu-error.hidden {
        display: none;
      }
      .menu-status {
        color: #8de35b;
        font-size: 13px;
        margin-top: -4px;
        margin-bottom: 10px;
      }
      .menu-status.hidden {
        display: none;
      }
      .clear-passcode-section {
        margin-top: 10px;
        padding-top: 14px;
        border-top: 1px solid rgba(255, 255, 255, 0.12);
      }
      .clear-passcode-section.hidden {
        display: none;
      }
      .clear-passcode-section .menu-input {
        margin-bottom: 10px;
      }

      .hidden {
        display: none;
      }

      .loading-indicator {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        padding: clamp(28px, 8vw, 48px) 0;
      }
      .loading-indicator.hidden {
        display: none;
      }
      .spinner {
        width: 36px;
        height: 36px;
        border: 4px solid rgba(255, 255, 255, 0.15);
        border-top-color: #8de35b;
        border-radius: 50%;
        animation: spinner-rotate 0.8s linear infinite;
      }
      @keyframes spinner-rotate {
        to {
          transform: rotate(360deg);
        }
      }
      .loading-text {
        color: #b9c2e0;
        font-size: clamp(12px, 3vw, 14px);
        font-weight: 700;
      }

      .leaderboard-section {
        margin: 14px 0;
        max-height: 34vh;
        overflow-y: auto;
      }
      .leaderboard-title {
        font-size: clamp(12px, 3vw, 14px);
        color: #b9c2e0;
        font-weight: 700;
        margin-bottom: 8px;
        text-align: left;
      }
      .leaderboard-table {
        width: 100%;
        border-collapse: collapse;
        font-size: clamp(12px, 3vw, 14px);
      }
      .leaderboard-table th,
      .leaderboard-table td {
        text-align: left;
        padding: 8px 6px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      }
      .leaderboard-table th {
        color: #b9c2e0;
        font-weight: 700;
        font-size: 0.85em;
      }
      .outcome-finished {
        color: #8de35b;
        font-weight: 700;
      }
      .outcome-lost {
        color: #ff8a8a;
        font-weight: 700;
      }
      .outcome-unfinished {
        color: #ffd35c;
        font-weight: 700;
      }

      .score-chart {
        display: flex;
        flex-direction: column;
        gap: 14px;
        margin-top: 6px;
      }
      .score-bar-row {
        text-align: left;
      }
      .score-bar-label {
        font-size: 13px;
        font-weight: 700;
        color: #e9edf7;
        margin-bottom: 4px;
      }
      .score-bar-track {
        width: 100%;
        height: 22px;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 999px;
        overflow: hidden;
      }
      .score-bar-fill {
        height: 100%;
        border-radius: 999px;
        transition: width 0.4s ease;
        min-width: 4px;
      }
      .score-bar-value {
        font-size: 12px;
        color: #b9c2e0;
        margin-top: 4px;
      }
      .score-chart-empty {
        color: #7c86ab;
        font-size: 13px;
        text-align: left;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="canvasHost"></div>
      <div id="hud">
        <div class="top-row">
          <div class="progress">
            <div class="progress-label" id="raceProgressLabel">Race Progress</div>
            <div class="progress-pct" id="progressPct">0%</div>
            <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
          </div>
          <button id="pauseBtn" class="pause-btn" type="button" aria-label="Pause">❚❚</button>
          <div class="star-pill"><span class="star-icon">★</span><span id="starCount">0</span></div>
        </div>

        <div id="pausedOverlay" class="paused-overlay hidden">PAUSED</div>
        <div id="popupLayer" class="popup-layer"></div>
        <div id="badgeBar" class="badge-bar"></div>
        <div id="strikeBar" class="strike-bar"></div>
        <div id="milestoneBanner" class="milestone-banner"></div>
        <div id="hitFlash" class="hit-flash"></div>

        <button id="leftBtn" class="arrow-btn" type="button" aria-label="Move left">‹</button>
        <button id="rightBtn" class="arrow-btn" type="button" aria-label="Move right">›</button>

        <div id="finishOverlay" class="finish-overlay hidden">
          <div class="finish-card">
            <div class="finish-title">Finish!</div>
            <div class="finish-score"><span id="finalStarCount">0</span><span class="star-icon">★</span></div>
            <div class="finish-subtitle">stars collected</div>
            <button id="retryBtn" class="retry-btn" type="button">Retry</button>
            <button id="viewLeaderboardBtn" class="secondary-action-btn" type="button">View Leaderboard</button>
          </div>
        </div>

        <div id="loseOverlay" class="lose-overlay hidden">
          <div class="lose-card">
            <div class="lose-title">Oops, you lost!</div>
            <button id="loseRetryBtn" class="retry-btn" type="button">Retry</button>
            <button id="loseViewLeaderboardBtn" class="secondary-action-btn" type="button">View Leaderboard</button>
          </div>
        </div>

        <!-- <button id="menuToggleBtn" class="menu-toggle-btn" type="button" aria-label="Menu">☰</button>
        <div id="quickMenu" class="quick-menu hidden">
          <button id="openLeaderboardBtn" class="menu-btn secondary" type="button">Leaderboard</button>
        </div> -->

        <div id="startDialog" class="modal-overlay">
          <div class="modal-card">
            <div class="modal-title" id="startDialogTitle">Enter your name to start</div>
            <input id="playerNameInput" class="menu-input" type="text" placeholder="Your name" maxlength="24" />
            <div id="startDialogError" class="menu-error hidden"></div>
            <button id="startRaceBtn" class="menu-btn" type="button">Start</button>
          </div>
        </div>

        <div id="leaderboardOverlay" class="modal-overlay hidden">
          <div class="modal-card">
            <button id="closeLeaderboardBtn" class="modal-close-btn" type="button" aria-label="Close">✕</button>
            <div class="modal-title">Leaderboard</div>
            <div id="leaderboardLoading" class="loading-indicator hidden">
              <div class="spinner"></div>
              <div class="loading-text">Loading leaderboard…</div>
            </div>
            <div id="leaderboardTableSection" class="leaderboard-section">
              <table class="leaderboard-table">
                <thead>
                  <tr>
                    <th>Player</th>
                    <th>Result</th>
                    <th>★</th>
                    <th>✕</th>
                  </tr>
                </thead>
                <tbody id="menuLeaderboardBody"></tbody>
              </table>
            </div>
            <div id="leaderboardError" class="menu-error hidden"></div>
            <div id="leaderboardStatus" class="menu-status hidden"></div>
            <button id="clearLeaderboardBtn" class="menu-btn danger" type="button">Clear Leaderboard</button>
            <div id="clearPasscodeSection" class="clear-passcode-section hidden">
              <input
                id="clearPasscodeInput"
                class="menu-input"
                type="password"
                placeholder="Type the passcode to confirm"
                autocomplete="off"
              />
              <div id="clearPasscodeError" class="menu-error hidden"></div>
              <button id="confirmClearBtn" class="menu-btn danger-solid" type="button">Confirm Clear</button>
              <button id="cancelClearBtn" class="menu-btn secondary" type="button">Cancel</button>
            </div>
          </div>
        </div>

        <div id="scoreDistributionOverlay" class="modal-overlay hidden">
          <div class="modal-card">
            <button id="closeScoreDistributionBtn" class="modal-close-btn" type="button" aria-label="Close">✕</button>
            <div class="modal-title">Score Distribution</div>
            <div id="scoreChart" class="score-chart"></div>
            <div id="scoreDistributionError" class="menu-error hidden"></div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
